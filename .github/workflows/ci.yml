name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: "Run tests (pytest)"
        run: pytest -v

  lint:
    name: "lint and type-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: "Lint (ruff)"
        run: ruff check .

      - name: "Type-check (mypy --strict)"
        run: mypy

  smoke:
    name: "smoke test: generate PDF, extract, verify CSV"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - name: "Generate a ruled-table PDF (expected: one 3x2 table)"
        run: |
          python - <<'PY'
          from reportlab.lib import colors
          from reportlab.platypus import SimpleDocTemplate, Table, TableStyle
          from reportlab.lib.pagesizes import letter

          data = [
              ["Name", "Role"],
              ["Alice", "Engineer"],
              ["Bob", "Manager"],
          ]
          doc = SimpleDocTemplate("smoke.pdf", pagesize=letter)
          t = Table(data)
          t.setStyle(TableStyle([
              ("GRID", (0, 0), (-1, -1), 1, colors.black),
              ("FONTNAME", (0, 0), (-1, 0), "Helvetica-Bold"),
          ]))
          doc.build([t])
          PY

      - name: Extract tables with the CLI
        run: pdf-tables smoke.pdf --out smoke_out

      - name: "Verify CSV content (expected: header + Alice row + Bob row)"
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          manifest = json.loads(Path("smoke_out/manifest.json").read_text())
          assert manifest["n_tables"] == 1, manifest
          entry = manifest["tables"][0]
          assert entry["strategy"] == "ruled", entry
          assert entry["header_detected"] is True, entry

          csv_path = Path("smoke_out") / entry["csv"]
          with csv_path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.reader(f))
          assert rows == [["Name", "Role"], ["Alice", "Engineer"], ["Bob", "Manager"]], rows
          print("smoke test OK:", rows)
          PY
